name: Update and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
    # Weekly reset: 06:00 Europe/Berlin (04:00 UTC summer / 05:00 UTC winter)
    - cron: "0 4,5 * * 3"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch WoW data
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/update-data.mjs
      - name: Preserve season history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "Aktualisiere WoW-Dashboard-Daten"
          git push
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R data _site/data
          [ ! -d assets ] || cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
